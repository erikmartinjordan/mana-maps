<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maña Maps · La Fábrica — Mundo voxel 3D</title>
<meta name="description" content="La fábrica de agentes de Maña Maps convertida en un diorama voxel 3D interactivo: cinta de tickets, estaciones, torre de despliegue y galería.">
<meta name="theme-color" content="#080909">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080909;--primary:#f0edf4;--secondary:#9c9aa2;--third:#737179;
  --border:rgba(255,255,255,.09);--accent:#e8b86d;
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--primary);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0;background:
  radial-gradient(1100px 720px at 50% 34%,#151617 0%,#0c0d0d 52%,#080909 100%);}
#app canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;}

.hud{position:fixed;z-index:10;pointer-events:none;}
.hud > *{pointer-events:auto;}
.top{top:22px;left:26px;}
.brand{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 12px;border-radius:18px;
  background:rgba(14,15,15,.82);border:1px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(12px);}
.logo{position:relative;width:40px;height:40px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));flex-shrink:0;}
.logo svg{width:100%;height:100%;display:block;}
.brand-txt strong{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--primary);}
.brand-txt em{display:block;font-style:normal;font-size:10.5px;color:var(--third);font-weight:600;margin-top:3px;letter-spacing:.02em;}

.ctrl{top:22px;right:26px;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:16px;
  background:rgba(14,15,15,.86);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(12px);}
.icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:#101111;color:#d9d5e1;
  cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s,border-color .15s,transform .15s;}
.icobtn:hover{background:var(--accent);color:#171719;border-color:var(--accent);}
.icobtn:active{transform:scale(.94);}
.icobtn svg{width:14px;height:14px;display:block;}
.icobtn.on{color:var(--accent);border-color:rgba(232,184,109,.45);}
.icobtn.on:hover{color:#171719;}
.spd{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--third);font-weight:600;}
.spd input{width:92px;accent-color:var(--accent);cursor:pointer;}
.spd b{font-family:'DM Mono',monospace;color:var(--primary);font-size:11px;width:28px;}
.clock{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:12px;color:var(--secondary);
  font-weight:600;background:rgba(16,17,17,.72);padding:5px 10px;border-radius:9px;border:1px solid var(--border);}
.clock .time{color:var(--primary);font-size:13px;font-weight:700;}
.clock .label{font-size:9px;color:var(--third);text-transform:uppercase;letter-spacing:.05em;}
.chk{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--third);font-weight:600;cursor:pointer;white-space:nowrap;}
.chk input{accent-color:var(--accent);cursor:pointer;}
.sep{width:1px;height:22px;background:var(--border);}

.legend{left:26px;bottom:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:640px;}
.lg{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:50px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;background:rgba(14,15,15,.82);border:1px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);color:var(--secondary);}
.lg i{width:9px;height:9px;border-radius:3px;box-shadow:0 0 10px currentColor;}
.lg b{font-family:'DM Mono',monospace;color:var(--primary);font-weight:500;}

.foot{right:26px;bottom:22px;display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:50px;
  background:rgba(14,15,15,.82);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(10px);}
.pub{display:flex;align-items:baseline;gap:7px;font-size:10.5px;color:var(--third);font-weight:600;white-space:nowrap;}
.pub b{font-family:'DM Mono',monospace;font-size:15px;color:#10b981;font-weight:500;line-height:1;}
.hint{font-size:10.5px;color:var(--third);font-weight:500;white-space:nowrap;}
html.embedded .hud.top,
html.embedded .hud.legend,
html.embedded .hud.foot{display:none;}
html.embedded .ctrl{top:12px;right:12px;}

.info-panel{position:fixed;z-index:30;right:26px;top:50%;width:352px;max-width:calc(100vw - 32px);
  padding:22px 22px 20px;border-radius:20px;background:rgba(13,14,14,.96);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 28px 80px rgba(0,0,0,.65);
  backdrop-filter:blur(18px);opacity:0;visibility:hidden;
  transform:translateY(-50%) translateX(18px);transition:opacity .22s,transform .22s,visibility .22s;}
.info-panel.on{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);}
.info-panel::before{content:"";position:absolute;left:22px;right:22px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--ip-accent,var(--accent)),transparent);}
.ip-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;border:1px solid var(--border);
  background:#151717;color:var(--secondary);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,color .15s,border-color .15s;}
.ip-close:hover{background:var(--ip-accent,var(--accent));color:#101111;border-color:transparent;}
.ip-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-right:26px;}
.ip-num{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 7px;border-radius:7px;
  background:var(--ip-accent,var(--accent));color:#101111;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;}
.ip-kicker{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--third);}
.info-panel h2{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--primary);margin-bottom:8px;}
.info-panel p{font-size:12.5px;line-height:1.55;color:var(--secondary);font-weight:500;}
.info-panel .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.info-panel .chips span{padding:4px 10px;border-radius:50px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.06);font-family:'DM Mono',monospace;font-size:10px;color:#d9d5e1;}

@media (max-width:860px){
  .info-panel{left:12px;right:12px;top:auto;bottom:92px;width:auto;max-width:none;
    transform:translateY(16px);padding:18px 18px 16px;}
  .info-panel.on{transform:translateY(0);}
  .info-panel h2{font-size:19px;}
}

#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);
  transition:opacity .6s ease,visibility .6s;text-align:center;}
#loading.done{opacity:0;visibility:hidden;}
#loading .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 16px;}
#loading p{font-size:12px;color:var(--third);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
#loading small{display:block;margin-top:8px;font-size:11px;color:#4a494f;font-weight:500;letter-spacing:0;}
@keyframes spin{to{transform:rotate(360deg);}}

@media (max-width:1080px){
  .spd span{display:none;}
  .clock{display:none;}
  .hint{display:none;}
}
@media (max-width:860px){
  .top{top:12px;left:12px;right:12px;}
  .brand{padding:8px 12px 8px 10px;gap:10px;}
  .brand-txt strong{font-size:15px;}
  .brand-txt em{font-size:9.5px;}
  .logo{width:32px;height:32px;}
  .ctrl{top:auto;bottom:12px;right:12px;left:12px;justify-content:center;gap:10px;padding:8px 10px;flex-wrap:wrap;}
  .legend,.foot{display:none;}
  .spd input{width:74px;}
}
@media (prefers-reduced-motion:reduce){
  #loading .spin{animation-duration:2.4s;}
}
</style>
<script type="importmap">
{
  "imports": {

}

</head>
<body>
<div id="app" role="img" aria-label="Diorama voxel 3D de la fábrica de agentes de Maña Maps: Erik dirige desde su escritorio, la cinta transporta tickets por las estaciones de Backlog, Constructor, Tests, Revisor y PR hasta la torre de despliegue y la galería en vivo."></div>

<header class="hud top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 200 200"><path fill="#30363B" stroke="rgba(1,1,1,0.5)" stroke-width="1" d="M42.3,-74.7C55.1,-65.8,66.1,-55.2,74.7,-42.4C83.2,-29.7,89.3,-14.8,89.7,0.2C90,15.2,84.6,30.5,74.3,40.2C64,49.8,48.7,54,35.6,62.1C22.4,70.2,11.2,82.3,-0.8,83.6C-12.7,84.9,-25.4,75.4,-36.1,65.9C-46.9,56.4,-55.6,46.8,-61.3,35.8C-66.9,24.8,-69.5,12.4,-72,-1.4C-74.5,-15.3,-76.9,-30.5,-70.9,-41C-64.9,-51.4,-50.6,-57.1,-37.4,-65.8C-24.2,-74.5,-12.1,-86.1,1.3,-88.4C14.7,-90.7,29.5,-83.6,42.3,-74.7Z" transform="translate(100 100)"/><g transform="translate(62.7889 133.0811) scale(0.04069010 -0.04069010)"><path fill="#fff" d="M1675 0H1303V987L1032 350H777L506 987V0H154V1489H585L915 754L1244 1489H1675Z"/><path fill="#fff" transform="translate(1530 -40)" d="M-186 2061Q-196 1894 -269.0 1816.5Q-342 1739 -472 1739Q-520 1739 -563.0 1758.5Q-606 1778 -637 1797Q-667 1816 -703.5 1835.5Q-740 1855 -765 1855Q-815 1855 -833.0 1823.5Q-851 1792 -855 1733H-1065Q-1059 1879 -983.0 1966.5Q-907 2054 -780 2054Q-732 2054 -691.0 2037.0Q-650 2020 -612 1998Q-582 1981 -546.0 1962.0Q-510 1943 -487 1943Q-439 1943 -418.5 1975.0Q-398 2007 -396 2061Z"/></g></svg>
    </div>
    <div class="brand-txt">
      <strong>Maña Maps</strong>
      <em>La fábrica · mundo voxel 3D</em>
    </div>
  </div>
</header>

<div class="hud ctrl">
  <button id="playBtn" class="icobtn" aria-label="Pausar animación" title="Pausar / reproducir (espacio)">
    <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.4"/><rect x="14" y="4" width="5" height="16" rx="1.4"/></svg>
    <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4.8c0-1.1 1.2-1.8 2.2-1.2l11 6.4c1 .6 1 2 0 2.6l-11 6.4c-1 .6-2.2-.1-2.2-1.2V4.8z"/></svg>
  </button>
  <label class="spd"><span>Velocidad</span><input type="range" id="spd" min="1" max="3" step="1" value="1"><b id="spdVal">1×</b></label>
  <span class="sep"></span>
  <label class="chk"><input type="checkbox" id="chkLbl" checked> Etiquetas</label>
  <button id="orbitBtn" class="icobtn on" aria-label="Rotación automática" title="Rotación automática">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
  </button>
  <div class="clock"><span class="label">Ciclo</span><span class="time" id="simClock">00:00</span><span class="label">/ 6:00 h</span></div>
</div>

<div class="hud legend" aria-label="Agentes de la fábrica">
  <span class="lg" style="color:#0ea5e9"><i style="background:#0ea5e9"></i><b>A1</b> Ideador</span>
  <span class="lg" style="color:#8b5cf6"><i style="background:#8b5cf6"></i><b>A2</b> Constructor</span>
  <span class="lg" style="color:#10b981"><i style="background:#10b981"></i><b>A3</b> Tests</span>
  <span class="lg" style="color:#f59e0b"><i style="background:#f59e0b"></i><b>A4</b> Revisor</span>
  <span class="lg" style="color:#e11d48"><i style="background:#e11d48"></i><b>A5</b> Chat / Blogger</span>
  <span class="lg" style="color:#d9d5e1"><i style="background:#d9d5e1"></i><b>E</b> Erik</span>
</div>

<div class="hud foot">
  <span class="pub"><b id="pubCount">0</b> publicaciones</span>
  <span class="hint">Arrastra para orbitar · rueda para zoom</span>
</div>

<aside id="infoPanel" class="info-panel" role="dialog" aria-modal="false" aria-live="polite" aria-labelledby="infoTitle">
  <button class="ip-close" id="infoClose" aria-label="Cerrar información">&times;</button>
  <div class="ip-head"><span class="ip-num" id="infoNum"></span><span class="ip-kicker" id="infoKicker"></span></div>
  <h2 id="infoTitle"></h2>
  <p id="infoBody"></p>
  <div class="chips" id="infoChips"></div>
</aside>

<div id="loading"><div><div class="spin"></div><p>Cargando la fábrica voxel</p><small>three.js · geometría de cubos · sin recursos locales</small></div></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#080909;color:#9c9aa2;font:600 14px 'DM Sans',sans-serif">Activa JavaScript para ver el mundo voxel.</div></noscript>
<script>
setTimeout(function () {
  if (window.__voxelReady) return;
  var el = document.getElementById('loading');
  if (!el || el.classList.contains('done')) return;
  var p = el.querySelector('p');
  var s = el.querySelector('small');
  if (p) p.textContent = 'No se pudo cargar three.js';
  if (s) s.textContent = 'Revisa la conexión e inténtalo de nuevo';
}, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

if (window.top !== window.self) document.documentElement.classList.add('embedded');

const app = document.getElementById('app');
const loading = document.getElementById('loading');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

await Promise.race([
  (document.fonts && document.fonts.ready) || Promise.resolve(),
  new Promise((r) => setTimeout(r, 1600))
]);

const COLORS = {
  blue:'#0ea5e9', cyan:'#38bdf8', purple:'#8b5cf6', amber:'#f59e0b',
  green:'#10b981', rose:'#e11d48', slate:'#94a3b8', paper:'#e8eef2',
  warm:'#e8b86d', ink:'#202324'
};

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#0b0c0c', 62, 132);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 320);
camera.position.set(55, 31, 51);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(26, 2.9, 15);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.7;
controls.minDistance = 22;
controls.maxDistance = 98;
controls.minPolarAngle = Math.PI * 0.12;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = true;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.5;
controls.update();

const UNIT = new THREE.BoxGeometry(1, 1, 1);
const EDGE_GEO = new THREE.EdgesGeometry(UNIT);

function stdMat(hex, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex),
    roughness: opts.roughness ?? 0.86,
    metalness: opts.metalness ?? 0.08,
    flatShading: true
  });
}
function glowMat(hex, intensity = 1.2, base = '#0a0b0c') {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(base),
    emissive: new THREE.Color(hex),
    emissiveIntensity: intensity,
    roughness: 0.38,
    metalness: 0.15,
    flatShading: true
  });
}

const MAT = {
  floorBase: stdMat('#15191a'),
  floorBase2: stdMat('#111415'),
  floorBase3: stdMat('#0d0f10'),
  belt: stdMat('#464b4d', { roughness: 0.72, metalness: 0.34 }),
  beltTop: stdMat('#303537', { roughness: 0.6, metalness: 0.4 }),
  metal: stdMat('#3b4143', { roughness: 0.66, metalness: 0.4 }),
  metalLight: stdMat('#5c6264', { roughness: 0.6, metalness: 0.38 }),
  dark: stdMat('#222627', { roughness: 0.9 }),
  kiosk: stdMat('#34393b', { roughness: 0.8 }),
  crate: stdMat('#4a423c', { roughness: 0.86 }),
  crateBand: stdMat('#6b6058', { roughness: 0.7 }),
  wood: stdMat('#5b4c3f', { roughness: 0.92 }),
  tower: stdMat('#565a5b', { roughness: 0.82 }),
  towerDark: stdMat('#3b3f40', { roughness: 0.86 }),
  skin: stdMat('#f3c396', { roughness: 0.9 }),
  hair: stdMat('#2b2f36', { roughness: 0.96 }),
  hazardAmber: stdMat('#f59e0b', { roughness: 0.7 }),
  hazardDark: stdMat('#1d2021', { roughness: 0.86 })
};

function box(parent, w, h, d, x, y, z, material, opts = {}) {
  const mesh = new THREE.Mesh(UNIT, material);
  mesh.scale.set(w, h, d);
  mesh.position.set(x, y, z);
  mesh.castShadow = opts.cast !== false;
  mesh.receiveShadow = opts.receive !== false;
  parent.add(mesh);
  return mesh;
}
function groupAt(parent, x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  parent.add(g);
  return g;
}

/* ── lighting ─────────────────────────────────────────────────────────── */
scene.add(new THREE.HemisphereLight('#40525d', '#121516', 1.2));
scene.add(new THREE.AmbientLight('#ffffff', 0.2));

const key = new THREE.DirectionalLight('#ffe0b3', 3.1);
key.position.set(34, 48, 24);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -44;
key.shadow.camera.right = 44;
key.shadow.camera.top = 40;
key.shadow.camera.bottom = -32;
key.shadow.camera.near = 1;
key.shadow.camera.far = 150;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.035;
key.target.position.set(26, 0, 15);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight('#7ec8ef', 0.95);
fill.position.set(-26, 26, -34);
scene.add(fill);

const rim = new THREE.DirectionalLight('#e8b86d', 0.7);
rim.position.set(55, 14, 45);
scene.add(rim);

/* ── floor: voxel diorama ─────────────────────────────────────────────── */
const FLOOR_W = 52;
const FLOOR_D = 30;
const floorGeo = new THREE.BoxGeometry(0.94, 0.42, 0.94);
const floorMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.95, metalness: 0.05, flatShading: true });
const floor = new THREE.InstancedMesh(floorGeo, floorMat, FLOOR_W * FLOOR_D);
const dummy = new THREE.Object3D();
const shadeA = new THREE.Color('#1e2223');
const shadeB = new THREE.Color('#232728');
const shadeC = new THREE.Color('#282d2f');
let fi = 0;
for (let x = 0; x < FLOOR_W; x++) {
  for (let z = 0; z < FLOOR_D; z++) {
    dummy.position.set(x + 0.5, -0.21, z + 0.5);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    floor.setMatrixAt(fi, dummy.matrix);
    const nearBelt = Math.abs(z + 0.5 - 14) < 4.5 ? 1 : 0;
    const pick = ((x * 7 + z * 3 + nearBelt) % 11);
    floor.setColorAt(fi, pick === 0 ? shadeC : (pick % 2 ? shadeA : shadeB));
    fi++;
  }
}
floor.instanceMatrix.needsUpdate = true;
floor.instanceColor.needsUpdate = true;
floor.receiveShadow = true;
scene.add(floor);

box(scene, 54, 2.2, 32, 26, -1.4, 15, MAT.floorBase, { cast: false, receive: true });
box(scene, 50.4, 2.0, 28.4, 26, -3.4, 15, MAT.floorBase2, { cast: false, receive: false });
box(scene, 46, 2.0, 24, 26, -5.2, 15, MAT.floorBase3, { cast: false, receive: false });

const rng = (seed) => {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
const rand = rng(20261109);
const rockMat = stdMat('#111415');
for (let i = 0; i < 26; i++) {
  const side = i % 4;
  const t = rand();
  let x, z;

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeTextSprite(text, opts = {}) {
  const wpx = 512, hpx = opts.small ? 128 : 168;
  const c = document.createElement('canvas');
  c.width = wpx; c.height = hpx;
  const ctx = c.getContext('2d');
  const accent = opts.accent || COLORS.warm;
  roundRect(ctx, 2, 2, wpx - 4, hpx - 4, opts.small ? 22 : 30);
  ctx.fillStyle = 'rgba(15,16,16,.94)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (opts.small) {
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(48, hpx / 2, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#d9d5e1';
    ctx.font = '700 42px "DM Sans", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 72, hpx / 2 + 2);
  } else {
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(64, hpx / 2, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111315';
    ctx.font = '800 30px "DM Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(opts.badge || '', 64, hpx / 2 + 1);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f0edf4';
    ctx.font = '700 44px "DM Sans", sans-serif';
    ctx.fillText(text, 116, hpx / 2 - 14);
    if (opts.sub) {
      ctx.fillStyle = '#8d8b93';
      ctx.font = '500 23px "DM Sans", sans-serif';
      ctx.fillText(opts.sub, 116, hpx / 2 + 33);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  const w = opts.w ?? 4.1;
  sprite.scale.set(w, w * hpx / wpx, 1);
  sprite.renderOrder = 6;
  toggleableLabels.push(sprite);
  return sprite;
}

function makeVoxelMark(opts = {}) {
  const S = 200;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff';
  ctx.save();
  ctx.translate(62.7889, 133.0811);
  ctx.scale(0.04069010, -0.04069010);
  ctx.fill(new Path2D(MARK_M));
  ctx.save();
  ctx.translate(1530, -40);
  ctx.fill(new Path2D(MARK_TILDE));
  ctx.restore();
  ctx.restore();

  const data = ctx.getImageData(0, 0, S, S).data;
  let minX = S, minY = S, maxX = -1, maxY = -1;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      if (data[(y * S + x) * 4 + 3] > 60) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 69; maxX = 131; minY = 51; maxY = 133; }

  const cols = opts.cols ?? 18, rows = opts.rows ?? 24, cell = opts.cell ?? 0.1;
  const mat = new THREE.MeshStandardMaterial({
    color: '#f0edf4',
    emissive: new THREE.Color(COLORS.warm),
    emissiveIntensity: 0.5,
    roughness: 0.5,
    metalness: 0.15,
    flatShading: true
  });
  const group = new THREE.Group();
  const spanX = maxX - minX + 1;
  const spanY = maxY - minY + 1;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      let hits = 0;
      for (let sy = 0; sy < 3; sy++) {
        for (let sx = 0; sx < 3; sx++) {
          const px = Math.min(maxX, Math.floor(minX + ((i + (sx + 0.5) / 3) / cols) * spanX));
          const py = Math.min(maxY, Math.floor(minY + ((j + (sy + 0.5) / 3) / rows) * spanY));
          if (data[(py * S + px) * 4 + 3] > 90) hits++;
        }
      }
      if (hits / 9 >= 0.34) {
        box(
          group,
          cell * 0.9, cell * 0.9, cell * 1.4,
          (i - (cols - 1) / 2) * cell,
          ((rows - 1) / 2 - j) * cell,
          0,
          mat
        );
      }
    }
  }
  return group;
}

function makeVoxelBadge(size = 2.6) {
  const S = 200;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff';
  ctx.save();
  ctx.translate(100, 100);
  ctx.fill(new Path2D(LOGO_BLOB));
  ctx.restore();

  const data = ctx.getImageData(0, 0, S, S).data;
  let minX = S, minY = S, maxX = -1, maxY = -1;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      if (data[(y * S + x) * 4 + 3] > 60) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 20; maxX = 180; minY = 22; maxY = 178; }

  const cols = 24, rows = 24;
  const spanX = maxX - minX + 1;
  const spanY = maxY - minY + 1;
  const cell = size / cols;
  const depth = cell * 1.7;
  const grid = [];
  for (let j = 0; j < rows; j++) {
    grid[j] = [];
    for (let i = 0; i < cols; i++) {
      let hits = 0;
      for (let sy = 0; sy < 3; sy++) {
        for (let sx = 0; sx < 3; sx++) {
          const px = Math.min(maxX, Math.floor(minX + ((i + (sx + 0.5) / 3) / cols) * spanX));
          const py = Math.min(maxY, Math.floor(minY + ((j + (sy + 0.5) / 3) / rows) * spanY));
          if (data[(py * S + px) * 4 + 3] > 90) hits++;
        }
      }
      grid[j][i] = hits / 9 >= 0.34;
    }
  }

  const darkMat = new THREE.MeshStandardMaterial({
    color: '#171919', roughness: 0.65, metalness: 0.25, flatShading: true
  });
  const rimMat = glowMat(COLORS.warm, 1.5, '#17130b');
  const group = new THREE.Group();
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      if (!grid[j][i]) continue;
      const edge = i === 0 || i === cols - 1 || j === 0 || j === rows - 1 ||
        !grid[j][i - 1] || !grid[j][i + 1] || !grid[j - 1] || !grid[j - 1][i] ||
        !grid[j + 1] || !grid[j + 1][i];
      box(
        group,
        cell * 0.94, cell * 0.94, depth,
        (i - (cols - 1) / 2) * cell,
        ((rows - 1) / 2 - j) * cell,
        0,
        edge ? rimMat : darkMat
      );
    }
  }
  return group;
}

/* ── gallery panels (live maps) ───────────────────────────────────────── */
const MAP_SLUGS = ['gibraltar', 'puertos-espana', 'fosas-pacifico'];
const MAP_FILLS = ['#0ea5e9', '#38bdf8', '#10b981'];
const panels = [];

function drawMapCard(canvasIndex, slugIndex) {
  const p = panels[canvasIndex];
  if (!p) return;
  const ctx = p.ctx;
  const w = p.canvas.width, h = p.canvas.height;
  ctx.clearRect(0, 0, w, h);
  roundRect(ctx, 4, 4, w - 8, h - 8, 22);
  ctx.fillStyle = 'rgba(15,16,16,.96)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.lineWidth = 3;
  ctx.stroke();
  roundRect(ctx, 22, 22, w - 44, h - 96, 14);
  ctx.fillStyle = '#0a1217';
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, 22, 22, w - 44, h - 96, 14);
  ctx.clip();
  const accent = MAP_FILLS[slugIndex % MAP_FILLS.length];
  ctx.fillStyle = accent;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  const cx = w / 2, cy = h / 2 - 12;
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const r = (w * 0.24) + Math.sin(a * 3 + slugIndex) * (w * 0.06) + Math.cos(a * 5) * (w * 0.03);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * 0.78;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = accent;
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = '#f0edf4';
  for (let i = 0; i < 4; i++) {
    const a = i * 1.7 + slugIndex;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * w * 0.15, cy + Math.sin(a) * w * 0.11, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#f0edf4';
  ctx.font = '700 32px "DM Mono", monospace';
  ctx.fillText(MAP_SLUGS[slugIndex % MAP_SLUGS.length], 28, h - 38);
  ctx.fillStyle = '#737179';
  ctx.font = '500 20px "DM Mono", monospace';
  ctx.fillText('MAP ' + String(canvasIndex + 1).padStart(2, '0'), w - 116, h - 38);
  p.tex.needsUpdate = true;
}

/* ── tickets ──────────────────────────────────────────────────────────── */
const GATES = [
  { x:13.5, node:'constructor', hold:0.9 },
  { x:19.5, node:'tests',       hold:0.7 },
  { x:25.5, node:'review',      hold:1.0 },
  { x:31.5, node:'merge',       hold:0.55 }
];

const TICKET_STATES = {
  blank:       { color:'#e8eef2', edge:'#9aa0a6', glow:'#9aa0a6' },
  constructor: { color:COLORS.purple, edge:'#c4b5fd', glow:COLORS.purple },
  tests:       { color:COLORS.green,  edge:'#6ee7b7', glow:COLORS.green },
  approved:    { color:COLORS.blue,   edge:'#7dd3fc', glow:COLORS.blue },
  merge:       { color:'#94a3b8',     edge:'#cbd5e1', glow:COLORS.slate },
  review:      { color:COLORS.amber,  edge:'#fcd34d', glow:COLORS.amber }
};

const tickets = [];
const ticketGeo = new THREE.BoxGeometry(0.92, 0.92, 0.92);

function makeTicket(x, state = 'blank') {
  const spec = TICKET_STATES[state];
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(spec.color),
    emissive: new THREE.Color(spec.glow),
    emissiveIntensity: 0.22,
    roughness: 0.48,
    metalness: 0.22,
    flatShading: true
  });
  const mesh = new THREE.Mesh(ticketGeo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(ticketGeo),
    new THREE.LineBasicMaterial({ color: new THREE.Color(spec.edge), transparent: true, opacity: 0.65 })
  );
  edge.scale.setScalar(1.002);
  g.add(edge);
  box(g, 0.24, 0.05, 0.24, 0, 0.5, 0, glowMat(spec.glow, 1.1, '#111'), { cast: false, receive: false });
  g.position.set(x, TICKET_Y, BELT_Z);
  scene.add(g);
  let gateIndex = 0;
  while (gateIndex < GATES.length && GATES[gateIndex].x <= x) gateIndex++;
  const t = {
    group: g, mesh, edge, state, mode: 'fwd', gateIndex,
    x, y: TICKET_Y, z: BELT_Z,
    hold: 0, flyT: 0, phase: Math.random() * Math.PI * 2,
    dead: false
  };
  tickets.push(t);
  return t;
}

function setTicketState(t, key) {
  const spec = TICKET_STATES[key];
  t.state = key;
  t.mesh.material.color.set(spec.color);
  t.mesh.material.emissive.set(spec.glow);
  t.edge.material.color.set(spec.edge);
}

/* ── factory state ────────────────────────────────────────────────────── */
let simT = 0;
let simClock = 0;
let speed = 1;
let paused = reduceMotion;
let publishCount = 0;
let gateOpen = 0;
let flash = 0;
let spawnCool = 2.4;
let erikCool = 8;
let bloggerCool = 15;
let lastClockText = '';

function trySpawn(byErik) {
  if (tickets.filter((t) => !t.dead).length >= 6) return false;
  const t = makeTicket(5.2, 'blank');
  t.phase = Math.random() * Math.PI * 2;
  if (byErik) {
    pulseStation('backlog', 1);
    popText('+1 idea', COLORS.amber, 5.2, 3.4, 14);
    popText('vía Telegram', '#229ED9', 5.2, 3.9, 14);
  } else {
    pulseStation('backlog', 0.7);
    popText('+1 tarea', COLORS.cyan, 5.2, 3.4, 14);
  }
  return true;
}

function startFly(t) {
  t.mode = 'fly';
  t.flyT = 0;
  t.p0 = t.group.position.clone();
  t.p1 = new THREE.Vector3(42.2, 6.4, 14.1);
  t.p2 = new THREE.Vector3(41.5, 1.6, 13.7);
  pulseStation('merge', 1.2);
  popText('deploy', COLORS.green, 41.5, 4.3, 14);
}

function quadraticBezier(p0, p1, p2, u, out) {
  const v = 1 - u;
  out.x = v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x;
  out.y = v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y;
  out.z = v * v * p0.z + 2 * v * u * p1.z + u * u * p2.z;
  return out;
}

const travelPoint = new THREE.Vector3();

function resolveGate(t) {
  const gate = GATES[t.gateIndex];
  if (!gate) return;
  if (gate.node === 'constructor') {
    setTicketState(t, 'constructor');
    pulseStation('constructor', 1);
    popText('</>', COLORS.purple, gate.x, 3.35, BELT_Z);
  } else if (gate.node === 'tests') {
    setTicketState(t, 'tests');
    pulseStation('tests', 1);
    popText('✓', COLORS.green, gate.x, 3.35, BELT_Z);
  } else if (gate.node === 'review') {
    pulseStation('review', 1.1);
    if (Math.random() < 0.26) {
      setTicketState(t, 'review');
      t.mode = 'back';
      t.gateIndex++;
      popText('↩', COLORS.amber, gate.x, 3.55, BELT_Z);
      return;
    }
    setTicketState(t, 'approved');
    popText('✓', COLORS.cyan, gate.x, 3.35, BELT_Z);
  } else if (gate.node === 'merge') {
    setTicketState(t, 'merge');
    gateOpen = 1;
    pulseStation('merge', 1.2);
    popText('↑', COLORS.cyan, gate.x, 3.55, BELT_Z);
  }
  t.gateIndex++;
  t.mode = 'fwd';
}

function updateTicket(t, dt) {
  if (t.mode === 'fly') {
    t.flyT += dt / 1.1;
    const u = Math.min(1, t.flyT);
    quadraticBezier(t.p0, t.p1, t.p2, u, travelPoint);
    t.group.position.copy(travelPoint);
    t.group.rotation.x += dt * 5.5;
    t.group.rotation.z += dt * 3.2;
    t.group.scale.setScalar(1 - u * 0.45);
    if (t.flyT >= 1) {
      t.dead = true;
      t.group.visible = false;
      flash = 1;
      publishCount++;
      burst(41.5, 1.8, 13.7, COLORS.green);
      popText('+' + publishCount, COLORS.green, 42.6, 3.4, 14.4);
      if (panels.length) {
        const idx = publishCount % panels.length;
        drawMapCard(idx, publishCount + 2);
      }
    }
    return;
  }

  if (t.mode === 'back') {
    t.x -= 4.2 * dt;
    t.z += (RETURN_Z - t.z) * Math.min(1, dt * 4);
    t.y += (RETURN_Y - t.y) * Math.min(1, dt * 4);
    if (t.x <= 11.9) {
      t.mode = 'fwd';
      t.gateIndex = 1;
      setTicketState(t, 'constructor');
      popText('</>', COLORS.purple, 11.9, 3.5, BELT_Z);
    }
    t.group.position.set(t.x, t.y, t.z);
    t.group.rotation.y += dt * 1.4;
    return;
  }

  if (t.mode === 'hold') {
    t.hold -= dt;
    t.group.position.set(t.x, t.y, t.z);
    if (t.hold <= 0) resolveGate(t);
    return;
  }

  t.x += 3.4 * dt;
  t.y += (TICKET_Y - t.y) * Math.min(1, dt * 5);
  t.z += (BELT_Z - t.z) * Math.min(1, dt * 5);
  t.group.position.set(t.x, t.y, t.z);
  t.group.rotation.y = Math.sin(simT * 1.4 + t.phase) * 0.06;

  if (t.gateIndex < GATES.length && t.x >= GATES[t.gateIndex].x) {
    t.x = GATES[t.gateIndex].x;
    t.mode = 'hold';
    t.hold = GATES[t.gateIndex].hold;
    pulseStation(GATES[t.gateIndex].node, 0.9);
  } else if (t.gateIndex >= GATES.length && t.x >= 40.6) {
    startFly(t);
  }
}

/* ── ambient + factory updates ────────────────────────────────────────── */
const scannerBaseX = 19.5;
const tmpColor = new THREE.Color();

function updateWorld(dt, factoryDt) {
  simT += factoryDt;

  if (!paused) {
    spawnCool -= factoryDt;
    if (spawnCool <= 0) {
      spawnCool = 4.6 + Math.random() * 2.6;
      trySpawn(false);
    }
    erikCool -= factoryDt;
    if (erikCool <= 0) {
      erikCool = 10 + Math.random() * 6;
      trySpawn(true);
    }
    bloggerCool -= factoryDt;
    if (bloggerCool <= 0) {
      bloggerCool = 17 + Math.random() * 10;
      popText('post', COLORS.rose, 39.5, 3.8, 24.4);
      if (vacation) vacation.sip = 1;
      if (panels.length) {
        const idx = Math.floor(Math.random() * panels.length);
        drawMapCard(idx, Math.floor(Math.random() * MAP_SLUGS.length));
      }
    }
    simClock += factoryDt / 60;
    if (simClock >= 6) simClock -= 6;
  }

  const minute = Math.floor(simClock * 60);
  const clockText = String(Math.floor(simClock)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
  if (clockText !== lastClockText) {
    lastClockText = clockText;
    if (clockEl) clockEl.textContent = clockText;
  }
  if (publishCount !== lastPublish) {
    lastPublish = publishCount;
    if (pubEl) pubEl.textContent = publishCount;
  }

  for (let i = tickets.length - 1; i >= 0; i--) {
    const t = tickets[i];
    if (!paused) updateTicket(t, factoryDt);
    if (t.dead) {
      scene.remove(t.group);
      if (t.edge.geometry) t.edge.geometry.dispose();
      t.group.traverse((o) => { if (o.material) o.material.dispose(); });
      tickets.splice(i, 1);
    }
  }

  for (const d of beltDashes) {
    const range = BELT_END - BELT_START - 2.4;
    const x = BELT_START + 1.2 + ((d.x - BELT_START - 1.2 + simT * 3.4) % range + range) % range;
    d.mesh.position.x = x;
  }

  gateOpen = Math.max(0, gateOpen - dt * 2.2);
  gatePivot.rotation.x = -gateOpen * 1.32;

  scannerScan.position.x = scannerBaseX + Math.sin(simT * 1.7) * 1.2;
  scannerScan.material.opacity = 0.12 + (Math.sin(simT * 3.4) * 0.5 + 0.5) * 0.08;

  if (towerWarmMat) towerWarmMat.emissiveIntensity = 1.25 + Math.sin(simT * 1.8) * 0.32;
  flash = Math.max(0, flash - dt * 1.6);
  if (towerFlash) {
    towerFlash.visible = flash > 0.001;
    towerFlash.material.opacity = flash * 0.32;
  }
  beltLight.intensity = 14 + Math.sin(simT * 2.2) * 3;

  for (const key of Object.keys(stationByKey)) {
    const st = stationByKey[key];
    st.active = Math.max(0, st.active - dt * 1.9);
    const pulse = st.active > 0 ? Math.min(1, st.active * 1.5) : 0;
    st.ring.material.opacity = pulse * (0.28 + 0.22 * (Math.sin(simT * 8) * 0.5 + 0.5));
    const ringScale = 1 + pulse * 0.06 + Math.sin(simT * 6) * 0.015 * pulse;
    st.ring.scale.setScalar(ringScale);
    st.light.intensity = 2.2 + pulse * 7.5;
    if (st.bubble) {
      st.bubble.position.y = 4.2 + Math.sin(simT * 2.4) * 0.12;
      st.bubble.rotation.y = Math.sin(simT * 0.9) * 0.2;
    }
  }

  for (const a of stationAgents) {
    const st = stationByKey[a.station];
    const active = st ? st.active : 0;
    const lift = active > 0 ? Math.sin((1 - Math.min(1, active)) * Math.PI) * 0.16 : 0;
    a.agent.position.y = a.baseY + Math.sin(simT * 2.1 + a.phase) * 0.035 + lift;
    a.agent.rotation.z = active > 0 ? Math.sin(simT * 10) * 0.05 : 0;
  }

  if (chatBot) {
    const ang = simT * 0.8;
    chatBot.position.x = 6.9 + Math.cos(ang) * 0.72;
    chatBot.position.z = 22.9 + Math.sin(ang) * 0.5;
    chatBot.position.y = 2.05 + Math.sin(simT * 2.2) * 0.16;
    chatBot.rotation.y = -ang;
    chatBubble.position.set(chatBot.position.x, chatBot.position.y + 1.15, chatBot.position.z);
    chatBubble.lookAt(camera.position.x, camera.position.y, camera.position.z);
    const bscale = 1 + Math.sin(simT * 3.1) * 0.06;
    chatBubble.scale.setScalar(bscale);
  }

  if (vacation) {
    vacation.crown.rotation.z = Math.sin(simT * 0.8 + 1.2) * 0.025;
    vacation.crown.rotation.x = Math.sin(simT * 0.65) * 0.018;
    vacation.water.material.opacity = 0.58 + Math.sin(simT * 1.3) * 0.04;
    vacation.foam.scale.setScalar(1 + Math.sin(simT * 1.6) * 0.02);
    vacation.sip = Math.max(0, vacation.sip - dt * 1.4);
    const sip = vacation.sip > 0 ? Math.sin((1 - vacation.sip) * Math.PI) : 0;
    vacation.drink.position.y = vacation.baseDrinkY + sip * 0.035;
    vacation.laptopGlow.emissiveIntensity = 1.25 + Math.sin(simT * 2.4) * 0.25;
  }

  for (const c of clouds) {
    c.group.position.x = c.baseX + Math.sin(simT * 0.055 * c.speed + c.phase) * c.range;
    c.group.position.y += Math.sin(simT * 0.4 + c.phase) * 0.001;
  }

  for (const p of panels) {
    p.sprite.position.y = p.baseY + 0.35 + Math.sin(simT * 1.25 + p.phase) * 0.09;
    p.sprite.material.rotation = Math.sin(simT * 0.5 + p.phase) * 0.01;
  }

  if (window.__dust) {
    window.__dust.rotation.y = simT * 0.012;
  }

  for (let i = popEffects.length - 1; i >= 0; i--) {
    const f = popEffects[i];
    f.life -= dt;
    const k = 1 - f.life / f.max;
    f.sprite.position.y = f.y0 + k * 1.4;
    f.sprite.material.opacity = Math.max(0, 1 - k);
    if (f.life <= 0) {
      scene.remove(f.sprite);
      f.sprite.material.map.dispose();
      f.sprite.material.dispose();
      popEffects.splice(i, 1);
    }
  }

  for (const s of sparks) {
    if (s.userData.life <= 0) continue;
    s.userData.life -= dt;
    if (s.userData.life <= 0) {
      s.visible = false;
      continue;
    }
    s.userData.vel.y -= 8.6 * dt;
    s.position.addScaledVector(s.userData.vel, dt);
    const k = s.userData.life / s.userData.max;
    s.scale.setScalar(Math.max(0.05, k));
  }

  if (!paused) controls.autoRotate = orbitBtn.classList.contains('on');
}

const infoPanel = document.getElementById('infoPanel');

const infoKicker = document.getElementById('infoKicker');
const infoTitle = document.getElementById('infoTitle');
const infoBody = document.getElementById('infoBody');
const infoChips = document.getElementById('infoChips');

function openInfo(key) {
  const info = INFO[key];
  if (!info) { closeInfo(); return; }
  infoPanel.style.setProperty('--ip-accent', info.accent);
  infoNum.textContent = info.num;
  infoKicker.textContent = info.kicker;
  infoTitle.textContent = info.title;
  infoBody.textContent = info.body;
  infoChips.replaceChildren();
  info.chips.forEach((chip) => {
    const s = document.createElement('span');
    s.textContent = chip;
    infoChips.appendChild(s);
  });
  infoPanel.classList.add('on');
  if (stationByKey[key]) pulseStation(key, 1.2);
  if (key === 'main') flash = Math.max(flash, 0.65);
}

function closeInfo() {
  infoPanel.classList.remove('on');
}
infoClose.addEventListener('click', closeInfo);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function infoKeyAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(infoTargets, true);
  for (const hit of hits) {
    let o = hit.object;
    let key = null;
    let hidden = false;
    while (o) {
      if (!o.visible) hidden = true;
      if (!key && o.userData && o.userData.infoKey) key = o.userData.infoKey;
      o = o.parent;
    }
    if (!hidden && key) return key;
  }
  return null;
}

let tapStart = null;
renderer.domElement.style.cursor = 'grab';
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  tapStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
  renderer.domElement.style.cursor = 'grabbing';
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!tapStart || e.pointerId !== tapStart.id) return;
  const dx = e.clientX - tapStart.x;
  const dy = e.clientY - tapStart.y;
  const elapsed = performance.now() - tapStart.t;
  tapStart = null;
  renderer.domElement.style.cursor = 'grab';
  if (Math.hypot(dx, dy) > 6 || elapsed > 520) return;
  const key = infoKeyAt(e.clientX, e.clientY);
  if (key) openInfo(key); else closeInfo();
});

let hoverFrame = 0;
let hoverEvent = null;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (tapStart) return;
  hoverEvent = e;
  if (hoverFrame) return;
  hoverFrame = requestAnimationFrame(() => {
    hoverFrame = 0;
    if (!hoverEvent) return;
    renderer.domElement.style.cursor = infoKeyAt(hoverEvent.clientX, hoverEvent.clientY) ? 'pointer' : 'grab';
  });
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') closeInfo();
});

controls.addEventListener('start', () => {
  if (controls.autoRotate) {
    controls.autoRotate = false;
    orbitBtn.classList.remove('on');
  }
});

window.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'BUTTON' && tag !== 'TEXTAREA') {
    e.preventDefault();
    setPaused(!paused);
  }
});

let compactView = null;
function applyResponsiveCamera(force) {
  const compact = window.innerWidth / window.innerHeight < 0.85;
  if (!force && compact === compactView) return;
  compactView = compact;
  if (compact) {
    camera.fov = 54;
    camera.position.set(84, 25, 36);
    controls.target.set(26, 2.6, 15);
    controls.autoRotate = false;
    orbitBtn.classList.remove('on');
  } else {
    camera.fov = 42;
    camera.position.set(55, 31, 51);
    controls.target.set(26, 2.9, 15);
    controls.autoRotate = !reduceMotion;
    orbitBtn.classList.toggle('on', !reduceMotion);
  }
  camera.updateProjectionMatrix();
  controls.update();
}
applyResponsiveCamera(true);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  applyResponsiveCamera(false);
});

/* ── loop ─────────────────────────────────────────────────────────────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const factoryDt = paused ? 0 : dt * speed;
  updateWorld(dt, factoryDt);
  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(frame);
window.__voxelReady = true;
requestAnimationFrame(() => {
  loading.classList.add('done');
  setTimeout(() => { loading.style.display = 'none'; }, 700);
});

window.__fabricaVoxel = {
  scene, camera, controls, renderer,
  get paused() { return paused; },
  set paused(v) { setPaused(v); },
  get speed() { return speed; },
  set speed(v) { speed = v; spdInput.value = v; spdVal.textContent = v + '×'; },
  spawn: trySpawn
};
