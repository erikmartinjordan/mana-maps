name: Generate Map Images

on:
  push:
    branches: [main]
    paths:
      - 'data/gallery-*.js'
      - 'tools/render-map-images.js'
      - '.github/workflows/generate-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install --save-dev playwright-core@latest
          npx playwright-core install --with-deps chromium

      - name: Render map images
        run: |
          set -e
          echo "--- node_modules/playwright-core? ---"
          ls node_modules/playwright-core/package.json >/dev/null 2>&1 && echo "playwright-core OK" || echo "NO playwright-core"
          echo "--- chromium disponible? ---"
          ls ~/.cache/ms-playwright/ 2>/dev/null | head -3 || echo "no cache ms-playwright"
          echo "--- ejecutando render ---"
          node tools/render-map-images.js

      - name: Commit generated images
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@erikmartinjordan.dev"
          echo "--- og-cards contenido: ---"
          ls -la og-cards/ 2>&1 || echo "no og-cards dir"
          echo "--- git status: ---"
          git status --short
          git add -A og-cards/
          if git diff --cached --quiet; then
            echo "Sin cambios de imagen"
          else
            git commit -m "chore: generar imagenes OG de mapas"
            git push
            echo "Imagenes commiteadas"
          fi
