name: Generate Map Pages

on:
  schedule:
    # Diario 06:17 UTC: mantiene landings + OG cards al día con Firestore.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-map-landings.js'
      - 'tools/map-card.js'
      - '.github/workflows/generate-map-pages.yml'

permissions:
  contents: write

concurrency:
  group: generate-map-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install --save-dev playwright-core@latest
          npx playwright-core install --with-deps chromium

      - name: Generate Firebase runtime config
        env:
          FIREBASE_PRE_CONFIG_JSON: ${{ secrets.FIREBASE_PRE_CONFIG_JSON }}
          FIREBASE_PRO_CONFIG_JSON: ${{ secrets.FIREBASE_PRO_CONFIG_JSON }}
        run: node .github/scripts/generate-firebase-config.js

      - name: Generate static landings + OG cards
        run: node scripts/generate-map-landings.js

      - name: Commit generated pages
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@erikmartinjordan.dev"
          git add gallery og-cards
          if git diff --cached --quiet; then
            echo "Sin cambios en landings/OG"
          else
            git commit -m "chore: generar landings estaticas y OG cards de mapas"
            git push
            echo "Landings y OG commiteadas"
          fi
