name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local asset references in HTML
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          attr_re = re.compile(r'''\b(?:src|href)\s*=\s*(?P<q>["'])(?P<url>.*?)(?P=q)''', re.IGNORECASE)

          OPTIONAL_LOCAL_ASSETS = {'/js/firebase-config.local.js', 'js/firebase-config.local.js', '../js/firebase-config.local.js'}

          def should_skip(url: str) -> bool:
            u = url.strip()
            if not u:
              return True
            if u in OPTIONAL_LOCAL_ASSETS:
              return True
            return (
              u.startswith('#') or
              u.startswith('http://') or
              u.startswith('https://') or
              u.startswith('//') or
              u.startswith('mailto:') or
              u.startswith('tel:') or
              u.startswith('javascript:') or
              u.startswith('data:')
            )

          missing = []

          for html in html_files:
            text = html.read_text(encoding='utf-8')
            for m in attr_re.finditer(text):
              raw = m.group('url').split('?', 1)[0].split('#', 1)[0]
              if should_skip(raw):
                continue

              if raw.startswith('/'):
                target = root / raw.lstrip('/')
              else:
                target = html.parent / raw

              if raw.endswith('/'):
                target = target / 'index.html'

              if not target.exists():
                missing.append((str(html), raw))

          if missing:
            print('Missing local asset references found:')
            for file_path, ref in missing:
              print(f'  - {file_path}: {ref}')
            raise SystemExit(1)

          print(f'Checked {len(html_files)} HTML files. All local references resolved.')
          PY

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check JavaScript files
        run: |
          mapfile -t js_files < <(find js -type f -name '*.js' | sort)
          if [ "${#js_files[@]}" -eq 0 ]; then
            echo 'No JavaScript files found in ./js'
            exit 1
          fi

          for file in "${js_files[@]}"; do
            node --check "$file"
          done

          echo "Checked ${#js_files[@]} JS files."

  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright test runner
        run: |
          npm init -y
          npm install --save-dev @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test -c tests/predeploy/playwright.config.js --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  changelog:
    name: Update Changelog
    needs: [static-checks, js-syntax, e2e-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: erikmartinjordan/mana-maps
        run: python .github/scripts/generate_changelog.py

      - name: Commit changelog
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog/index.html

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update changelog"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: [static-checks, js-syntax, e2e-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate Firebase runtime config
        env:
          FIREBASE_PRE_CONFIG_JSON: ${{ secrets.FIREBASE_PRE_CONFIG_JSON }}
          FIREBASE_PRO_CONFIG_JSON: ${{ secrets.FIREBASE_PRO_CONFIG_JSON }}
        run: node .github/scripts/generate-firebase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
