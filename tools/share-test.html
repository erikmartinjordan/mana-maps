<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share test · Maña Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#111214}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:24px;letter-spacing:-.5px;margin:0 0 6px}
  .status{font-size:13px;color:#5f6670;margin:0 0 16px;min-height:18px}
  .status.err{color:#c0392b;font-weight:600}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  button{border:none;border-radius:999px;padding:11px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:#17191c;color:#fff}
  button.sec{background:#fff;color:#111214;border:1px solid rgba(16,24,40,.14)}
  #preview{border:1px solid rgba(16,24,40,.12);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.12)}
  #preview svg{display:block;width:100%;height:auto}
  code{background:#ececf0;border-radius:6px;padding:2px 6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Share card test</h1>
  <p class="status" id="status">Iniciando…</p>
  <div class="bar">
    <button id="share">Compartir imagen</button>
    <button class="sec" id="dl">Descargar PNG</button>
  </div>
  <div id="preview"></div>
  <p class="status" style="margin-top:16px">Página de prueba local, sin Firebase. Carga <code>../data/tourism-arrivals-world.geojson</code> y genera la tarjeta con <code>js/share-card.js</code>.</p>
</div>
<script src="/js/world-land.js"></script>
<script src="/js/map-preview.js"></script>
<script src="/js/share-card.js"></script>
<script>
(function(){
  var status=document.getElementById('status');
  function set(t,err){ status.textContent=t; status.className='status'+(err?' err':''); if(err)console.error(t); }
  function fail(e){ set('ERROR: '+(e&&e.message||e),true); }
  window.onerror=function(m){ set('ERROR: '+m,true); };
  var opts=null;

  set('Cargando datos…');
  if(!window.ManaMapPreview){ set('ERROR: no cargó map-preview.js',true); return; }
  if(!window.ManaShareCard){ set('ERROR: no cargó share-card.js',true); return; }
  if(!window.WORLD_LAND_PATH){ set('Aviso: falta WORLD_LAND_PATH (world-land.js)',true); }

  fetch('../data/tourism-arrivals-world.geojson')
    .then(function(r){ if(!r.ok) throw new Error('fetch '+r.status); return r.json(); })
    .then(function(geo){
      set('Datos: '+geo.features.length+' features. Renderizando…');
      geo.features.forEach(function(f){
        var p=f.properties||{};
        if(!p._manaColor) p._manaColor = p.c || '#d9d9d9';
        if(typeof p._manaFillOpacity!=='number') p._manaFillOpacity = 0.9;
        if(p._manaName===undefined) p._manaName = p.n;
      });
      opts={ title:'Países que más reciben turistas internacionales', subtitle:'Turistas internacionales (llegadas)', source:'Fuente: UN Tourism (OMT)', geojson:geo, valueKey:'v' };
      var svg;
      try { svg = window.ManaShareCard.build(opts); } catch(e){ return fail(e); }
      document.getElementById('preview').innerHTML = svg;
      window.__opts=opts;
      set('Generando PNG…');
      window.ManaShareCard.toBlob(opts,{scale:2}).then(function(bl){ window.__blob=bl; set('Listo. Tarjeta generada y PNG preparado. Prueba Compartir / Descargar.'); }).catch(fail);
    }).catch(fail);

  document.getElementById('dl').onclick=function(){
    if(!window.__blob){ set('Aún generando…'); return; }
    try { window.ManaShareCard.downloadBlob(window.__blob, window.ManaShareCard.filename('mapa')); set('PNG descargado.'); }
    catch(e){ fail(e); }
  };
  document.getElementById('share').onclick=function(){
    if(!window.__blob){ set('Aún generando…'); return; }
    try { Promise.resolve(window.ManaShareCard.shareBlob(window.__blob,'mapa')).then(function(){set('Compartido.');}); }
    catch(e){ set('Share no disponible, descargando…'); window.ManaShareCard.downloadBlob(window.__blob, window.ManaShareCard.filename('mapa')); }
  };
})();
</script>
</body>
</html>
